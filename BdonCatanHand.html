<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#163a5c">
<title>Catan Hand</title>
<style>
  :root {
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s6: 24px;
    --t-sm: .8rem; --t-md: 1rem; --t-lg: 1.25rem; --t-xl: 1.5rem; --t-2xl: 2rem;
    --radius: 12px; --tap: 44px;
    --bg: #163a5c; --bg2: #2f6b3a; --fg: #fff; --accent: #ffd76a; --warn: #ffb4a8; --ink: #1a1a1a;
    --shadow: 0 4px 12px #0005;
  }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background: linear-gradient(170deg, var(--bg), #1c5f8e 45%, var(--bg2)) fixed; min-height: 100vh; color: var(--fg); margin: 0; padding: max(var(--s3), env(safe-area-inset-top)) var(--s3) 120px; max-width: 520px; margin-inline: auto; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  main { position: relative; }
  h1 { font-size: var(--t-xl); margin: 0 0 var(--s4); text-align: center; }
  h2 { font-size: var(--t-sm); margin: var(--s6) 0 var(--s3); color: var(--accent); text-transform: uppercase; letter-spacing: .1em; text-align: center; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s3); }
  .card { position: relative; min-width: 0; animation: rise .4s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i) * 40ms); border-radius: var(--radius); box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; gap: var(--s1); padding: var(--s3) var(--s2) var(--s2); }
  .card .icon { font-size: var(--t-2xl); line-height: 1.2; }
  .card .name { font-size: var(--t-sm); font-weight: 600; text-align: center; }
  .card .count { font-size: var(--t-2xl); font-weight: 700; line-height: 1.2; margin-top: auto; }
  .card .ctl { display: flex; gap: var(--s2); width: 100%; margin-top: var(--s1); }
  button { font-family: inherit; font-size: var(--t-lg); font-weight: 700; border: 0; border-radius: var(--radius); cursor: pointer; background: #ffffff33; color: inherit; min-height: var(--tap); transition: transform .08s, opacity .15s; }
  button:active { transform: scale(.94); }
  button:focus-visible, .card:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
  button[aria-disabled="true"] { opacity: .35; cursor: default; }
  .card button { flex: 1; background: #fff; color: var(--ink); }
  .brick { background: #b5431f; } .lumber { background: #23704a; } .sheep { background: #9bd66a; color: #1c3312; }
  .hay { background: #ffc83d; color: #4a3200; } .ore { background: #5b6779; } .dev { background: #5a3fbf; }
  .total { text-align: center; color: var(--accent); margin-top: var(--s3); font-size: var(--t-md); }
  .total.over { color: var(--warn); }
  #dice { position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; gap: var(--s3); padding: var(--s3) var(--s3) max(var(--s3), env(safe-area-inset-bottom)); background: #0b1520f2; border-top: 2px solid var(--accent); }
  .die { width: 56px; height: 56px; background: #fff; color: var(--ink); border-radius: var(--radius); font-size: var(--t-2xl); display: grid; place-items: center; font-weight: 700; }
  .card .count.pop { animation: pop .3s cubic-bezier(.2,.8,.2,1); }
  .chip { position: absolute; top: 40%; left: 50%; transform: translateX(-50%); font-weight: 700; font-size: var(--t-lg); pointer-events: none; animation: float .7s ease-out forwards; }
  .card:has(.pop) { animation: nudge .3s; }
  @keyframes rise { from { opacity: 0; transform: translateY(16px) scale(.96); } }
  @keyframes pop { 40% { transform: scale(1.35); } }
  @keyframes nudge { 30% { transform: scale(1.03); } }
  @keyframes float { to { transform: translate(-50%, -48px); opacity: 0; } }
  .die.tumble { animation: tumble .5s cubic-bezier(.2,.8,.2,1); }
  @keyframes tumble { 20% { transform: rotate(-20deg) scale(1.15); } 50% { transform: rotate(20deg) scale(1.1); } 80% { transform: rotate(-6deg); } }
  #sum.pop { animation: pop .3s; }
  @media (prefers-reduced-motion: reduce) { .card, .die, .count, .chip, #sum, .shelf { animation: none !important; } button { transition: none; } }
  #roll { padding: 0 var(--s6); background: var(--accent); color: #4a3200; }
  #sum { font-size: var(--t-xl); font-weight: 700; color: var(--accent); min-width: 2.5ch; }
  .corner { position: absolute; top: max(var(--s3), env(safe-area-inset-top)); width: var(--tap); font-size: var(--t-lg); }
  .corner.left { left: var(--s3); } .corner.right { right: var(--s3); }
  .shelf { position: fixed; inset: 0 0 0 auto; margin: 0; height: 100%; max-height: none; width: min(360px, 88vw); border: 0; border-left: 2px solid var(--accent); background: linear-gradient(170deg, var(--bg), #1c5f8e 45%, var(--bg2)); color: var(--fg); padding: 0; box-shadow: var(--shadow); display: flex; flex-direction: column; }
  .shelf.left { inset: 0 auto 0 0; border-left: 0; border-right: 2px solid var(--accent); }
  .shelf:not([open]) { display: none; }
  .shelf[open] { animation: slide .3s cubic-bezier(.2,.8,.2,1); }
  .shelf.left[open] { animation-name: slide-l; }
  .shelf::backdrop { background: #0008; }
  @keyframes slide-l { from { transform: translateX(-100%); } }
  .grid.two { grid-template-columns: 1fr 1fr; }
  .shelf-head, .shelf-foot { flex: none; display: flex; align-items: center; padding: var(--s3); gap: var(--s3); }
  .shelf-head { padding-top: max(var(--s3), env(safe-area-inset-top)); border-bottom: 1px solid #ffffff22; }
  .shelf-head h2 { flex: 1; margin: 0; text-align: left; }
  .shelf-foot { padding-bottom: max(var(--s3), env(safe-area-inset-bottom)); border-top: 1px solid #ffffff22; }
  .shelf-body { flex: 1; overflow-y: auto; padding: var(--s3); display: flex; flex-direction: column; gap: var(--s3); }
  .shelf .close { width: var(--tap); flex: none; }
  #add-player { flex: 1; font-size: var(--t-md); }
  @keyframes slide { from { transform: translateX(100%); } }
  .player { background: #ffffff1a; border-radius: var(--radius); border-left: 8px solid var(--pc); padding: var(--s3); display: flex; flex-direction: column; gap: var(--s3); }
  .player .head { display: flex; gap: var(--s2); align-items: center; }
  .player input, .player select { font: inherit; font-weight: 600; height: var(--tap); border: 0; border-radius: var(--radius); padding: 0 var(--s3); background: #ffffff22; color: inherit; min-width: 0; }
  .player select { flex: 0 0 auto; -webkit-appearance: none; appearance: none; }
  .player input { flex: 1; }
  .player .rm { width: var(--tap); flex: none; background: transparent; color: var(--warn); font-size: var(--t-md); }
  .player .stats { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s2); }
  .player .stat { background: #00000022; border-radius: var(--radius); padding: var(--s2); display: flex; flex-direction: column; align-items: center; gap: var(--s1); }
  .player .stat .lbl { font-size: var(--t-sm); font-weight: 600; opacity: .85; }
  .player .stat .ctl { display: flex; align-items: center; gap: var(--s1); width: 100%; }
  .player .stat .ctl button { flex: 1; min-width: 0; background: #fff; color: var(--ink); }
  .player .stat b { font-size: var(--t-xl); min-width: 2ch; text-align: center; }
  .mkt { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); }
  .item { background: #ffffff1a; border-radius: var(--radius); padding: var(--s3); display: flex; flex-direction: column; gap: var(--s2); box-shadow: var(--shadow); }
  .item .name { font-weight: 700; }
  .item .cost { font-size: var(--t-md); letter-spacing: .05em; }
  .item button { background: var(--accent); color: #4a3200; font-size: var(--t-md); margin-top: auto; }
  .item button[aria-disabled="true"] { background: #ffffff33; color: var(--fg); }
  #toast { position: fixed; left: var(--s3); right: var(--s3); bottom: 96px; margin-inline: auto; max-width: 480px; background: #fff; color: var(--ink); border-radius: var(--radius); padding: var(--s3); font-weight: 600; text-align: center; box-shadow: var(--shadow); opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: 1; }
  #toast.err { background: var(--warn); }
  #reset { width: 100%; margin-top: var(--s6); color: var(--warn); border: 2px solid #ffb4a866; background: transparent; font-size: var(--t-md); }
</style>
</head>
<body>
<main>
  <h1>Catan Hand</h1>
  <button id="open-dev" class="corner left" aria-label="Open development cards">🎴</button>
  <button id="open-shelf" class="corner right" aria-label="Open players">👥</button>
  <section aria-labelledby="h-res">
    <h2 id="h-res">Resources</h2>
    <div id="resources" class="grid"></div>
    <p class="total" id="total-wrap" aria-live="polite">Total resource cards: <b id="total">0</b></p>
  </section>
  <section aria-labelledby="h-mkt">
    <h2 id="h-mkt">Market</h2>
    <div id="market" class="mkt"></div>
  </section>
  <button id="reset">Reset hand</button>
</main>
<dialog id="dev-shelf" class="shelf left" aria-labelledby="h-dev">
  <div class="shelf-head"><h2 id="h-dev">Dev Cards</h2><button class="close" aria-label="Close development cards">✕</button></div>
  <div class="shelf-body"><div id="devcards" class="grid two"></div></div>
</dialog>
<dialog id="shelf" class="shelf right" aria-labelledby="h-pl">
  <div class="shelf-head"><h2 id="h-pl">Players</h2><button class="close" aria-label="Close players">✕</button></div>
  <div class="shelf-body" id="players"></div>
  <div class="shelf-foot"><button id="add-player">+ Add player</button></div>
</dialog>
<div id="toast" role="status" aria-live="polite"></div>
<footer id="dice">
  <div class="die" id="d1" aria-label="die one">–</div>
  <div class="die" id="d2" aria-label="die two">–</div>
  <span id="sum" aria-live="polite"></span>
  <button id="roll">Roll</button>
</footer>
<script>
  const RESOURCES = ['Brick', 'Lumber', 'Sheep', 'Hay', 'Ore'];
  const DEV = ['Knight', 'Victory Point', 'Road Building', 'Year of Plenty', 'Monopoly'];
  const ICON = { Brick: '🧱', Lumber: '🌲', Sheep: '🐑', Hay: '🌾', Ore: '⛰️', Knight: '⚔️', 'Victory Point': '🏆', 'Road Building': '🛣️', 'Year of Plenty': '🎁', Monopoly: '🎩' };
  const KEY = 'catanHand';
  let hand = {};
  try { hand = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { hand = {}; }
  [['Wool','Sheep'],['Grain','Hay']].forEach(([o, n]) => { if (o in hand) { hand[n] = hand[o]; delete hand[o]; } }); // migrate old names

  function card(name, cls) {
    const el = document.createElement('div');
    el.className = 'card ' + cls;
    el.innerHTML = `<span class="icon" aria-hidden="true">${ICON[name]}</span>
      <span class="name">${name}</span>
      <span class="count" aria-live="polite" aria-label="${name} count">0</span>
      <span class="ctl"><button data-n="${name}" data-d="-1" aria-label="Remove ${name}">−</button><button data-n="${name}" data-d="1" aria-label="Add ${name}">+</button></span>`;
    return el;
  }
  RESOURCES.forEach(n => document.getElementById('resources').append(card(n, n.toLowerCase())));
  DEV.forEach(n => document.getElementById('devcards').append(card(n, 'dev')));
  document.querySelectorAll('.card').forEach((c, i) => c.style.setProperty('--i', i));

  function render() {
    document.querySelectorAll('.card').forEach(c => {
      const n = c.querySelector('.name').textContent, v = hand[n] || 0, el = c.querySelector('.count');
      if (el.textContent != v) { el.textContent = v; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
      c.querySelector('[data-d="-1"]').setAttribute('aria-disabled', v === 0);
    });
    document.querySelectorAll('[data-buy]').forEach(b => b.setAttribute('aria-disabled', !Object.entries(MARKET[b.dataset.buy]).every(([r, q]) => (hand[r] || 0) >= q)));
    const total = RESOURCES.reduce((s, n) => s + (hand[n] || 0), 0);
    document.getElementById('total').textContent = total;
    document.getElementById('total-wrap').classList.toggle('over', total > 7); // robber discard threshold
    localStorage.setItem(KEY, JSON.stringify(hand));
  }

  document.body.addEventListener('click', e => {
    const b = e.target.closest('button[data-n]');
    if (!b) return;
    const cur = hand[b.dataset.n] || 0, d = Number(b.dataset.d);
    if (cur + d < 0) return;
    hand[b.dataset.n] = cur + d;
    const chip = document.createElement('span');
    chip.className = 'chip'; chip.textContent = d > 0 ? '+1' : '−1';
    chip.onanimationend = () => chip.remove();
    b.closest('.card').append(chip);
    render();
  });

  const MARKET = { Road: { Brick: 1, Lumber: 1 }, Settlement: { Brick: 1, Lumber: 1, Sheep: 1, Hay: 1 }, City: { Hay: 2, Ore: 3 }, 'Dev Card': { Sheep: 1, Hay: 1, Ore: 1 } };
  const MICON = { Road: '🛣️', Settlement: '🏠', City: '🏰', 'Dev Card': '🎴' };
  Object.entries(MARKET).forEach(([n, cost]) => {
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML = `<span class="name">${MICON[n]} ${n}</span><span class="cost">${Object.entries(cost).map(([r, q]) => ICON[r].repeat(q)).join(' ')}</span><button data-buy="${n}" aria-label="Buy ${n}">Buy</button>`;
    document.getElementById('market').append(el);
  });
  let toastT;
  function toast(msg, err) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = 'show' + (err ? ' err' : '');
    clearTimeout(toastT); toastT = setTimeout(() => t.className = '', 2200);
  }
  document.getElementById('market').addEventListener('click', e => {
    const b = e.target.closest('button[data-buy]');
    if (!b) return;
    const cost = MARKET[b.dataset.buy];
    const missing = Object.entries(cost).filter(([r, q]) => (hand[r] || 0) < q).map(([r, q]) => `${q - (hand[r] || 0)} ${ICON[r]} ${r}`);
    if (missing.length) return toast(`Can't buy ${b.dataset.buy}: need ${missing.join(', ')}`, true);
    Object.entries(cost).forEach(([r, q]) => hand[r] -= q);
    render();
    toast(`Bought ${b.dataset.buy}!` + (b.dataset.buy === 'Dev Card' ? ' Tap the card you drew.' : ''));
  });

  document.getElementById('roll').onclick = () => {
    const r = () => 1 + Math.floor(Math.random() * 6), a = r(), b = r();
    roll.disabled = true; sum.textContent = '';
    [d1, d2].forEach(d => { d.classList.remove('tumble'); void d.offsetWidth; d.classList.add('tumble'); });
    let n = 0;
    const t = setInterval(() => {
      d1.textContent = r(); d2.textContent = r();
      if (++n < 8) return;
      clearInterval(t);
      d1.textContent = a; d2.textContent = b; sum.textContent = '= ' + (a + b);
      sum.classList.remove('pop'); void sum.offsetWidth; sum.classList.add('pop');
      roll.disabled = false;
    }, 60);
  };

  const COLORS = { Red: '#d0342c', Blue: '#2b5fd9', White: '#f4f4f4', Orange: '#f28c28', Green: '#3f9a4b', Brown: '#7a4b2a' };
  const PKEY = 'catanPlayers';
  let players = [];
  try { players = JSON.parse(localStorage.getItem(PKEY)) || []; } catch (e) { players = []; }

  function renderPlayers() {
    const wrap = document.getElementById('players');
    wrap.innerHTML = '';
    players.forEach((p, i) => {
      const el = document.createElement('div');
      el.className = 'player'; el.style.setProperty('--pc', COLORS[p.color] || '#888');
      const stat = (f, icon, label, val) => `<div class="stat"><span class="lbl">${icon} ${label}</span><span class="ctl"><button data-i="${i}" data-f="${f}" data-d="-1" aria-label="Remove ${label}">−</button><b>${val}</b><button data-i="${i}" data-f="${f}" data-d="1" aria-label="Add ${label}">+</button></span></div>`;
      el.innerHTML = `<div class="head">
          <select data-i="${i}" data-f="color" aria-label="Player color">${Object.keys(COLORS).map(c => `<option${c === p.color ? ' selected' : ''}>${c}</option>`).join('')}</select>
          <input data-i="${i}" data-f="name" value="${p.name.replace(/"/g, '&quot;')}" placeholder="Name" aria-label="Player name">
          <button class="rm" data-i="${i}" data-f="rm" aria-label="Remove player">✕</button>
        </div>
        <div class="stats">${stat('pts', '🏆', 'Points', p.pts)}${stat('dev', '🎴', 'Dev cards', p.dev)}</div>`;
      wrap.append(el);
    });
    localStorage.setItem(PKEY, JSON.stringify(players));
  }

  document.querySelectorAll('.shelf').forEach(d => {
    d.querySelector('.close').onclick = () => d.close();
    d.onclick = e => { if (e.target === d) d.close(); };
  });
  document.getElementById('open-shelf').onclick = () => shelf.showModal();
  document.getElementById('open-dev').onclick = () => document.getElementById('dev-shelf').showModal();
  document.getElementById('add-player').onclick = () => {
    const used = players.map(p => p.color), color = Object.keys(COLORS).find(c => !used.includes(c)) || 'Red';
    players.push({ name: '', color, pts: 0, dev: 0 });
    renderPlayers();
    document.querySelector('#players .player:last-child input').focus();
  };
  document.getElementById('players').addEventListener('click', e => {
    const b = e.target.closest('button[data-f]');
    if (!b) return;
    const p = players[b.dataset.i];
    if (b.dataset.f === 'rm') { if (confirm(`Remove ${p.name || 'this player'}?`)) players.splice(b.dataset.i, 1); }
    else p[b.dataset.f] = Math.max(0, p[b.dataset.f] + Number(b.dataset.d));
    renderPlayers();
  });
  document.getElementById('players').addEventListener('change', e => {
    const f = e.target.dataset.f;
    if (!f) return;
    players[e.target.dataset.i][f] = e.target.value;
    if (f === 'color') renderPlayers(); else localStorage.setItem(PKEY, JSON.stringify(players));
  });

  document.getElementById('reset').onclick = () => {
    if (!confirm('Reset your hand and all player points to zero?')) return;
    hand = {};
    players.forEach(p => { p.pts = 0; p.dev = 0; });
    render(); renderPlayers();
  };

  render(); renderPlayers();
</script>
</body>
</html>
