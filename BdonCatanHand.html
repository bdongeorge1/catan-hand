%2C397.0%20262.4%2C373.5%20262.4%2C326.5%20303.1%2C303.0%20343.8%2C326.5%22%20fill%3D%22%23c0562b%22%2F%3E%3Ccircle%20cx%3D%22303.1%22%20cy%3D%22350.0%22%20r%3D%2211%22%20fill%3D%22%23f3e6c4%22%2F%3E%3Ctext%20x%3D%22303.1%22%20y%3D%22354.0%22%20font-size%3D%2212%22%20font-weight%3D%22700%22%20text-anchor%3D%22middle%22%20fill%3D%22%23333%22%3E12%3C%2Ftext%3E%3Cpolygon%20points%3D%22430.4%2C373.5%20389.7%2C397.0%20349.0%2C373.5%20349.0%2C326.5%20389.7%2C303.0%20430.4%2C326.5%22%20fill%3D%22%232e7d46%22%2F%3E%3Ccircle%20cx%3D%22389.7%22%20cy%3D%22350.0%22%20r%3D%2211%22%20fill%3D%22%23f3e6c4%22%2F%3E%3Ctext%20x%3D%22389.7%22%20y%3D%22354.0%22%20font-size%3D%2212%22%20font-weight%3D%22700%22%20text-anchor%3D%22middle%22%20fill%3D%22%23333%22%3E2%3C%2Ftext%3E%3C%2Fsvg%3E") center / 260px auto; background-attachment: fixed; min-height: 100vh; color: #fff; margin: 0; padding: max(12px, env(safe-area-inset-top)) 12px 150px; max-width: 520px; margin-inline: auto; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  h1 { font-size: 1.9rem; margin: 4px 0 14px; text-align: center; text-shadow: 0 3px 0 #0006; letter-spacing: .02em; }
  h2 { font-size: .9rem; margin: 22px 0 10px; color: #ffd76a; text-transform: uppercase; letter-spacing: .12em; text-align: center; }

  .card { aspect-ratio: 2 / 3; border-radius: 16px; border: 4px solid #fff; box-shadow: 0 8px 0 #0004, 0 12px 24px #0006; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 10px 6px 8px; box-sizing: border-box; background-image: linear-gradient(160deg, #ffffff33, transparent 60%); transition: transform .1s; }

  .card .name { font-size: .72rem; font-weight: 700; text-align: center; text-transform: uppercase; letter-spacing: .06em; opacity: .9; }

  .card .ctl { display: flex; gap: 6px; width: 100%; }
  button { font-family: inherit; font-size: 1.2rem; font-weight: 700; border: 0; border-radius: 12px; cursor: pointer; background: #ffffff33; color: inherit; }
  .card button { flex: 1; height: 42px; font-size: 1.4rem; background: #ffffffcc; color: #222; box-shadow: 0 3px 0 #0004; }
  .card button:active { transform: translateY(3px); box-shadow: none; }
  .brick { background-color: #d9552d; } .lumber { background-color: #2e8b57; } .wool { background-color: #9bd66a; color: #1c3312; }
  .grain { background-color: #ffc83d; color: #4a3200; } .ore { background-color: #7c8aa0; } .dev { background-color: #6d4bd6; }
  .total { text-align: center; color: #ffd76a; margin-top: 12px; font-size: 1.05rem; }
  #dice { position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; gap: 14px; padding: 12px 12px max(12px, env(safe-area-inset-bottom)); background: #0b1520ee; border-top: 3px solid #ffd76a; backdrop-filter: blur(6px); }

  .die.spin { animation: wobble .5s; }
  @keyframes wobble { 25% { transform: rotate(-18deg) scale(1.15); } 50% { transform: rotate(18deg) scale(1.1); } 75% { transform: rotate(-8deg); } }

  #roll:active { transform: translateY(4px); box-shadow: none; }

<body>
    <h1>Catan Hand</h1>

    <h2>Resources</h2>
    <div id="resources" class="grid"></div>
    <div class="total">Total resource cards: <b id="total">0</b></div>

    <h2>Development Cards</h2>
    <div id="devcards" class="grid"></div>

    <div id="dice">
        <div class="die" id="d1">–</div>
        <div class="die" id="d2">–</div>
        <span id="sum"></span>
        <button id="roll">Roll</button>
    </div>

    <button id="reset">Reset hand</button>

    <script>
        const RESOURCES = ['Brick', 'Lumber', 'Wool', 'Grain', 'Ore'];
        const ICON = {Brick: '🧱', Lumber: '🌲', Wool: '🐑', Grain: '🌾', Ore: '⛰️', Knight: '⚔️', 'Victory Point': '🏆', 'Road Building': '🛣️', 'Year of Plenty': '🎁', Monopoly: '🎩'};
        const DEV = ['Knight', 'Victory Point', 'Road Building', 'Year of Plenty', 'Monopoly'];
        const KEY = 'catanHand';

        let hand = JSON.parse(localStorage.getItem(KEY) || '{}');

        function row(name, cls) {
            const el = document.createElement('div');
            el.className = 'card ' + cls;
            el.innerHTML = `<span class="icon">${ICON[name]}</span>
      <span class="name">${name}</span>
      <span class="count">0</span>
      <span class="ctl"><button data-n="${name}" data-d="-1">−</button><button data-n="${name}" data-d="1">+</button></span>`;
            return el;
        }
        RESOURCES.forEach(n => document.getElementById('resources').append(row(n, n.toLowerCase())));
        DEV.forEach(n => document.getElementById('devcards').append(row(n, 'dev')));

        function render() {
            document.querySelectorAll('.card').forEach(r => {
                r.querySelector('.count').textContent = hand[r.querySelector('.name').textContent] || 0;
            });
            document.getElementById('total').textContent = RESOURCES.reduce((s, n) => s + (hand[n] || 0), 0);
            localStorage.setItem(KEY, JSON.stringify(hand));
        }

        document.body.addEventListener('click', e => {
            const b = e.target.closest('button[data-n]');
            if (!b) return;
            const n = b.dataset.n;
            hand[n] = Math.max(0, (hand[n] || 0) + Number(b.dataset.d));
            render();
        });

        document.getElementById('roll').onclick = () => {
            const a = 1 + Math.floor(Math.random() * 6), b = 1 + Math.floor(Math.random() * 6);
            d1.textContent = a; d2.textContent = b; sum.textContent = '= ' + (a + b);
    [d1, d2].forEach(d => { d.classList.remove('spin'); void d.offsetWidth; d.classList.add('spin'); });
        };

        document.getElementById('reset').onclick = () => {
            if (!confirm('Reset your whole hand to zero?')) return;
            hand = {};
            render();
        };

        render();
    </script>
</body>

</html>
